<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumColleagues&trade;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #050830;
            color: #050830;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ── Mosaic grid ── */
        #mosaic {
            position: fixed;
            inset: 0;
            display: grid;
            /* grid-template-columns set dynamically by JS so tiles stretch to fill full width */
            grid-auto-rows: 80px;
            gap: 2px;
            z-index: 0;
        }

        #mosaic .tile {
            background-color: #0d1240;
            background-size: cover;
            background-position: center;
            transition: opacity 0.6s ease;
            opacity: 0;
        }

        /* ── Dark tint overlay ── */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 48, 0.50);
            z-index: 1;
        }

        /* ── Centred content ── */
        .stage {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            padding: 3rem 3.5rem;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 4px;
            box-shadow: 0 8px 40px rgba(5, 8, 48, 0.35);
        }

        .logo { margin-bottom: 2.5rem; }

        .logo-text {
            font-size: 2.4rem;
            letter-spacing: -0.5px;
            color: #050830;
        }

        .logo-text .light { font-weight: 300; }
        .logo-text .bold  { font-weight: 700; }
        .logo-text .dot   { color: #2D8C6F; font-weight: 700; }

        .divider {
            width: 60px;
            height: 3px;
            background-color: #2D8C6F;
            margin: 0 auto 2rem;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #6b6e8a;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .tagline {
            font-size: 0.95rem;
            color: #9a9cb8;
            font-weight: 300;
            line-height: 1.6;
        }

        .tagline a {
            color: #2D8C6F;
            text-decoration: none;
            font-weight: 400;
        }

        .tagline a:hover { text-decoration: underline; }

        .footer {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.40);
            letter-spacing: 0.05em;
            z-index: 3;
        }

        @media (max-width: 480px) {
            .logo-text { font-size: 1.8rem; }
            h1 { font-size: 0.95rem; }
            .container { padding: 2rem 1.75rem; }
        }
    </style>
</head>
<body>

    <div id="mosaic" data-qc-faces data-tile="82"></div>
    <div id="overlay"></div>

    <div class="stage">
        <div class="container">
            <div class="logo">
                <span class="logo-text">
                    <span class="light">Quantum</span><span class="bold">Colleagues</span><span class="dot">.</span>
                </span>
            </div>

            <div class="divider"></div>

            <h1>Do some good with AI.</h1>

            <p class="tagline">
                Humans &amp; AI Agents working together. Post-AI Training for every generation.<br><br>
                <a href="mission.html">Mission</a> &middot; <a href="products.html">Products</a> &middot; <a href="proust.html">Proust</a> &middot; <a href="resources.html">Resources</a> &middot; <a href="press.html">Press</a> &middot; <a href="contact.html">Contact</a>
            </p>
        </div>
    </div>

    <!-- Photos sourced via Unsplash (unsplash.com) under the Unsplash License -->
    <div class="footer">quantumcolleagues.org</div>
<div style="position:fixed;bottom:0.4rem;right:1rem;font-size:0.6rem;color:rgba(255,255,255,0.22);z-index:3;letter-spacing:0.03em;">&copy; QuantumColleagues Ltd 2026 &middot; Company No. 17219359 &middot; <a href="https://www.pexels.com" style="color:inherit;text-decoration:none;">Photos: Pexels</a></div>

    <script src="qc-faces.js"></script>
</body>
</html>
